<!doctype html>
<html lang="tr">
  <body style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#171717;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td style="font-size:20px;font-weight:700;padding-bottom:24px;">
                Pulse<span style="color:#e8452c;">Fitness</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:22px;font-weight:600;padding-bottom:12px;">Aramıza hoş geldin!</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.6;color:#525252;padding-bottom:24px;">
                Pulse Fitness hesabını oluşturduğun için teşekkürler. Hesabını etkinleştirmek için
                e-posta adresini doğrula.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/dashboard"
                   style="display:inline-block;background:#e8452c;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:14px 28px;border-radius:10px;">
                  E-postamı doğrula
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#737373;">
                Bu hesabı sen oluşturmadıysan bu e-postayı yok sayabilirsin.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
